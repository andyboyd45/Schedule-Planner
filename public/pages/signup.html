<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="/public/css/home.css">
    <link rel="stylesheet" href="/public/css/form.css">
</head>
<body>
    <header class = 'page-header'>
        <div class="logo">
            <span class="logo-icon"></span>
            <span class="logo-text">Schedule Planner</span>
        </div>
        <nav class="top-links">
            <a href="/public/index.html" class="home-button" name="home">HOME</a>
        </nav>
    </header>


        <!-- Text on Right middle-->
        <div class = "form-container">
            
                <p>Sign Up</p>
        
            <!-- Sign up -->
                <form id = "signup-form">
                    <div class = "form-group">
                        <input  type = "text" class = "form-input" name = "username" id="username-input"  placeholder="Username">
                    </div>
                    <div class = "form-group">
                        <input  type = "email" class = "form-input" name = "email" id="email-input" placeholder="Email">
                    </div>
                    <div class = "form-group">
                        <input  type = "password" class = "form-input" name = "password" id="password-input" placeholder="Password">
                    </div>
                    <div class = "form-group">
                        <input  type = "password" class = "form-input" name = "confirm_password" id="confirm-password-input" placeholder="Confirm Password">
                    </div>
                    <div class = "form-group">
                    <button class = "signup-button" type="submit">Sign Up</button>
                    </div>
                    <p id = "error-message" class = "error-message"></p>
                    <p class = "login-link" id = "login-link">Already have an account? <a href="/public/pages/login.html">Login here</a></p>
                </form>
            
        </div>     

    <script src="/public/js/signup-form.js" defer></script>
</body>
</html>
