<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="/src/css/home.css">
    <link rel="stylesheet" href="/src/css/form.css">
</head>
<body>
    <header class = 'page-header'>
        <div class="logo">
            <span class="logo-icon"></span>
            <span class="logo-text">Schedule Planner</span>
        </div>
        <nav class="top-links">
            <a href="/index.html" class="home-button" name="home">HOME</a>
        </nav>
    </header>


        <!-- Text on Right middle-->
        <div class = "form-container">
            
                <p>Log in</p>
        
            <!-- Login -->
                <form id = "login-form" method="POST">
                    <div class = "form-group">
                        <input  type = "text" class = "form-input" name = "username" id="username-input"  placeholder="Username">
                    </div>
                    <div class = "form-group">
                        <input  type = "password" class = "form-input" name = "password" id="password-input" placeholder="Password">
                    </div>
                    <div class = "form-group">
                    <button class = "signup-button" type="submit">Log in</button>
                    </div>
                    <p id = "error-message" class = "error-message"></p>
                    <p class = "login-link" id = "login-link">Don't have an account? <a href="/src/pages/signup.html">Sign up here</a></p>
                </form>
            
        </div>     

    <script src="/src/js/login-form.js" defer></script>
</body>
</html>
